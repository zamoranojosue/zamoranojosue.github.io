<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Los Gatos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
     <body>
        <h1 id="titulo">
          Los Gatos Siameses
        </h1>
        <img
          id="gato"
          src="https://upload.wikimedia.org/wikipedia/commons/6/60/Neighbours_Siamese.jpg"
          alt="Gato Siámés"
          width="250"
          />
        <audio id="audio" controls loop>
          <source 
            src="Meow.mp3" 
            type="audio/mpeg"
          >
        </audio>
        <button 
        onclick="document.getElementById('audio').play()"
        >Reproducir música
        </button>
        <section>
         <br><br>
          <h2 id="Titulo-Curiosidades">
            Curiosidades
          </h2>
          <ul id="lista-curiosidades">
            <li>
              <button class="boton-curiosidad">Curiosidad 1</button>
                <fieldset hidden class="caja-curiosidad">
                  <p>El gato siamés es originario de Tailandia.</p>
                </fieldset>
            </li>
            <br>
            <li>
              <button class="boton-curiosidad">Curiosidad 2</button>
              <fieldset hidden class="caja-curiosidad">
                <p>Es conocido por ser muy extrovertido.</p>
              </fieldset>
            </li>
            <br>
            <li>
              <button class="boton-curiosidad">Curiosidad 3</button>
              <fieldset hidden class="caja-curiosidad">
                <p>Se cree que trae buena suerte a sus dueños.</p>
              </fieldset>
            </li>
          </ul>
        </section>
        <footer>
          <p>© 2026Los Gatos Siameses</p>
        </footer>
    </body>
  </html>
